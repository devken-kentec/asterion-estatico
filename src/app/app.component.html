<div [ngClass]="{'backdrop': open }"></div>
<nav class="navbar bg-dark fixed-top">
  <div class="row col-12">
    <div class="col-10 col-md-11 col-lg-11 col-xl-11 d-flex align-items-center">
      <a class="navbar-brand" href="#">
        <img src="imagens/asterion_logo.jpeg" alt="Asterion - Sistema de Gestão Finnanceira" width="50" height="50" class="d-inline-block align-text-top">
      </a>

      <div class="mt-3 menu-barra">
        <ul class="list-unstyled d-none d-lg-flex d-xl-flex d-md-flex font-weight-bold">
          <li class="nav-item">
              <a routerLink="/home" class="nav-link active" data-bs-toggle="modal" data-bs-target="#exampleModal">Menu</a>
          </li>
          <li class="nav-item">
              <a routerLink="/menu" class="nav-link active">Logar</a>
          </li>
        </ul>
      </div>
    </div>
    <div class="col-2 col-md-1 col-lg-1 col-xl-1 d-flex align-items-center justify-content-end">
      <button type="button" class="navbar-toggler d-lg-none d-xl-none d-md-none" (click)="abrirMenu()">
        <img src="imagens/hamburger.gif" alt="Menu">
      </button>
    </div>
  </div>
</nav>
<div class="sidebar-off" [ngClass]="{'sidebar-open ul': open }">
  <ul class="list-unstyled font-weight-bold">
    <li><a type="button" class="menu" routerLink="/home" (click)="abrirMenu()">Home</a></li>
    <li><a type="button" class="menu" routerLink="/postagem" (click)="abrirMenu()">Postagens</a></li>
    <li><a type="button" class="menu" routerLink="/categoria" (click)="abrirMenu()">Dicas</a></li>
    <li><a type="button" class="menu" routerLink="/menu" (click)="abrirMenu()">Logar</a></li>
  </ul>
</div>

<div style="margin-top: 120px;" class="container">
  <router-outlet/>
</div>
<footer class="py-3 bg-light fixed-bottom">
  <div class="small text-center text-muted bg-light">
    Desenvolvido com <i style="color: red;" class="fa fa-heart"></i> por:&nbsp;<span
      style="color: red; font-weight: bold;">KEN</span><span style="color:black; font-weight: bold;">TEC&nbsp; {{
      anoCorrente }}</span>
  </div>
</footer>
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Escolha uma opção.</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="row col-12 col-md-12">
          <div class="col-12 col-md-6">
              <div class="row">
                  <div class="d-grid gap-1 mb-1">
                    <button class="btn btn-secondary" data-bs-dismiss="modal" routerLink="movfin" type="button">Listar Movimentações</button>
                  </div>
              </div>
              <div class="row">
                  <div class="d-grid gap-1 mb-1">
                    <button class="btn btn-secondary " type="button">Lista Despesas</button>
                  </div>
              </div>
          </div>
          <div class="col-12 col-md-6">   
              <div class="row">
                  <div class="d-grid gap-1 mb-1">
                    <button class="btn btn-primary" data-bs-dismiss="modal" routerLink="movfin/new" type="button">Lançamentos</button>
                  </div>
              </div>
              <div class="row">
                  <div class="d-grid gap-1 mb-1">
                    <button class="btn btn-primary " type="button">Lançar Despesas</button>
                  </div>
              </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        
       
      </div>
    </div>
  </div>
</div>
